[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airgap-re"
version = "0.1.0"
description = "Security-first reverse-engineering MCP server: untrusted samples analysed in a no-network bubblewrap chamber, never executed."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "reverse-engineering", "sandbox", "bubblewrap", "ghidra", "security"]
dependencies = ["mcp==1.30.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
airgap-re = "re_mcp.server:main"

[tool.setuptools]
packages = ["re_mcp"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Bewusst gewählter, verteidigbarer Kern: Pyflakes (echte Fehler) + pycodestyle + Import-Sortierung.
# Opinionierte Stil-Regeln (UP/PL/BLE/S) sind nicht aktiviert — breites except in MCP-Tool-Grenzen
# ist Absicht (ein Tool darf den Server nie crashen).
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
